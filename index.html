<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradient</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the gradient is the workspace. Large live canvas on the left, a quiet control column on the right, library strip under the canvas. */
:root {
  --bg: #efeeeb;
  --panel: #f9f9f7;
  --line: #dddcd7;
  --fg: #171716;
  --muted: #6c6b66;
  --chip: #e7e6e2;
  --focus: #2f66f5;
  --on-fg: #f9f9f7;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --frame-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 20px 50px -28px rgba(0,0,0,.28);
  --primary: #171716;
  --card: #ffffff; --card-edge: rgba(0,0,0,.06); --card-line: rgba(0,0,0,.08); --card-line-strong: rgba(0,0,0,.16);
  --card-hover: rgba(0,0,0,.035); --card-sel: rgba(0,0,0,.06); --dot: rgba(0,0,0,.09);
  --art-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 10px 24px -14px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191918; --panel: #222221; --line: #2c2c2a; --fg: #ecebe7; --muted: #99988f;
    --chip: #242422; --focus: #7c9fff; --on-fg: #141413;
    --frame-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 26px 60px -24px rgba(0,0,0,.95), 0 10px 24px -12px rgba(0,0,0,.6);
    --art-shadow: 0 0 0 .5px rgba(255,255,255,.08), 0 12px 28px -14px rgba(0,0,0,.7);
    --primary: #c4c3bd;
    --card: #222221; --card-edge: rgba(255,255,255,.07); --card-line: rgba(255,255,255,.08); --card-line-strong: rgba(255,255,255,.18);
    --card-hover: rgba(255,255,255,.04); --card-sel: rgba(255,255,255,.07); --dot: rgba(255,255,255,.07); color-scheme: dark;
    --opt-track: #171716; --opt-on: #3b3b38;
  }
}
:root[data-theme="dark"] {
  --bg: #191918; --panel: #222221; --line: #2c2c2a; --fg: #ecebe7; --muted: #99988f;
  --chip: #242422; --focus: #7c9fff; --on-fg: #141413;
    --frame-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 26px 60px -24px rgba(0,0,0,.95), 0 10px 24px -12px rgba(0,0,0,.6);
    --art-shadow: 0 0 0 .5px rgba(255,255,255,.08), 0 12px 28px -14px rgba(0,0,0,.7);
    --primary: #c4c3bd;
    --card: #222221; --card-edge: rgba(255,255,255,.07); --card-line: rgba(255,255,255,.08); --card-line-strong: rgba(255,255,255,.18);
    --card-hover: rgba(255,255,255,.04); --card-sel: rgba(255,255,255,.07); --dot: rgba(255,255,255,.07); color-scheme: dark;
    --opt-track: #171716; --opt-on: #3b3b38;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 22px 22px;
  color: var(--fg);
  font: 14px/1.45 var(--sans);
  display: flex;
  flex-direction: column;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- Top: floating controls, no bar ---------- */
.top {
  position: relative; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 4px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.top .btn { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 16px -10px rgba(0,0,0,.25); }
.top .btn.primary { box-shadow: 0 6px 16px -8px rgba(0,0,0,.45); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px; font-size: 13px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--on-fg); border-color: var(--fg); }
.btn.primary:hover { opacity: .88; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.theme .sun { display: none; }
.btn.theme.is-dark .sun { display: block; }
.btn.theme.is-dark .moon { display: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }
.hist { display: flex; }
.hist .btn:first-child { border-radius: 8px 0 0 8px; }
.hist .btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; }

/* ---------- Main: canvas in the middle, dock floating at the bottom ---------- */
.app {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto auto;
}
.stage, .meta, .dock-wrap { grid-column: 1; }
.stage {
  min-height: 0;
  display: grid; place-items: center;
  padding: 16px 24px 8px;
  position: relative;
}
.frame {
  position: relative;
  border-radius: 24px;
  box-shadow: var(--frame-shadow);
  max-width: 100%;
}
.frame.circle, .frame.circle canvas, .sleeve .art.circle, .sleeve .art.circle canvas { border-radius: 50%; }
.frame canvas { display: block; width: 100%; height: 100%; border-radius: 24px; }
.handles { position: absolute; inset: 0; }
.h {
  --c: #fff;
  position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
  border-radius: 50%; border: 2px solid #fff; padding: 0; background: var(--c);
  box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.2);
  touch-action: none; cursor: grab;
  transition: transform .15s;
}
.h:active { cursor: grabbing; }
.h::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
.h.sel { transform: scale(1.35); box-shadow: 0 1px 5px rgba(0,0,0,.35), 0 0 0 .75px rgba(120,120,118,.9); }
.h.center { background: transparent; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
.h.center::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
.meta {
  text-align: center; font: 12px var(--mono); color: var(--muted);
  padding: 0 16px 14px; font-variant-numeric: tabular-nums;
}

/* ---------- Preset tiles ---------- */
.tile { position: relative; flex: none; }
.tile > button:first-child {
  width: 64px; height: 40px; border-radius: 7px; border: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
}
.tile > button:first-child:hover { transform: translateY(-1px); }
.tile .del {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel); font-size: 12px; line-height: 1; padding: 0;
  display: none; color: var(--muted);
}
.tile:hover .del, .tile .del:focus-visible { display: block; }
.empty { color: var(--muted); font-size: 12px; padding: 10px 0; }

/* ---------- Floating surfaces: dock, pop-up cards, export menu ---------- */
.card {
  background: var(--card); border-radius: 18px;
  box-shadow: 0 0 0 1px var(--card-edge), 0 18px 40px -22px rgba(0,0,0,.3);
}
.dock-wrap {
  position: relative; z-index: 10; display: flex; justify-content: center;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
}
.dock { display: flex; align-items: center; gap: 10px; padding: 8px; max-width: 100%; }
.dlabel {
  flex: none; width: 104px; padding-left: 10px; color: var(--muted); font: 500 11px var(--sans);
  text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dlabel.name { color: var(--fg); font-size: 13px; text-transform: none; letter-spacing: 0; }
.dock .tiles { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.dock .tiles::-webkit-scrollbar { display: none; }
.dock .tile > button:first-child { width: 72px; height: 46px; border-radius: 10px; transition: transform .15s, box-shadow .15s; }
.dock .tile > button:first-child:hover, .dock .tile > button:first-child:focus-visible { box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 0 0 2px var(--card), 0 0 0 3.5px var(--fg); }
.dtools { display: none; gap: 2px; }
.dbtn {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px;
  border: 0; border-radius: 10px; background: none; color: var(--fg); font: 500 13.5px var(--sans); white-space: nowrap;
}
.dbtn svg { color: var(--muted); flex: none; }
.dbtn:hover { background: var(--card-hover); }
.dbtn[aria-expanded="true"] { background: var(--card-sel); }
.dbtn[aria-expanded="true"] svg { color: var(--fg); }
.dbtn.on svg { color: var(--fg); }
.pop {
  position: absolute; bottom: calc(100% + 4px); left: 50%; width: 320px; padding: 10px 0; z-index: 15;
  animation: popin .16s ease-out;
}
.psep { height: 1px; margin: 6px 0; background: var(--card-line); }
@keyframes popin { from { opacity: 0; transform: translateY(6px); } }

/* right column: size, shape and motion settings */
.side {
  grid-column: 2; grid-row: 1 / -1; align-self: start;
  display: flex; flex-direction: column; overflow: hidden;
  width: 288px; max-height: calc(100% - 22px);
  margin: 10px max(20px, env(safe-area-inset-right, 0px)) 0 0;
}
.side-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 8px 0 8px; }
.side .seg { flex: 1; }
.side .seg.tex { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.side .seg.tex button { font-size: 13px; }
/* export lives at the foot of the column, always in view */
.side-foot { flex: none; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--card-line); }
.fbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 8px;
  border: 0; border-radius: 10px; background: var(--card-sel); color: var(--fg); font: 500 13px var(--sans); white-space: nowrap;
}
.fbtn svg { width: 16px; height: 16px; flex: none; }
.fbtn:hover:not(:disabled) { background: var(--card-line-strong); }
.fbtn:disabled { opacity: .38; cursor: default; }
.side .row { padding: 0 18px; }
.side .bar { margin: 2px 24px 22px; }
.side .swrow { padding: 2px 18px 14px; }
.rv { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 2px 14px 10px; }
.sizes button {
  display: grid; justify-items: center; gap: 5px; padding: 9px 0 7px; border: 0; border-radius: 10px;
  background: none; color: var(--muted); font: 500 11.5px var(--sans); transition: background .15s, color .15s;
}
.sizes button svg { height: 22px; }
.sizes button:hover { background: var(--card-hover); color: var(--fg); }
.sizes button[aria-pressed="true"] { background: var(--card-sel); color: var(--fg); }

.sidebtn { display: none; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; padding: 0 20px; }
.card .lbl { font-weight: 600; font-size: 14px; }
.card .row.slide { display: grid; grid-template-columns: 92px minmax(0, 1fr); }
.card .row.slide label { font-size: 14px; }

.card input[type="range"] { -webkit-appearance: none; appearance: none; height: 24px; margin: 0; background: transparent; cursor: pointer; }
.card input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px;
  background: linear-gradient(to right, var(--fg) var(--p, 50%), var(--card-line-strong) var(--p, 50%));
}
.card input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8.5px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.2);
}
.card input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--card-line-strong); }
.card input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--fg); }
.card input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.2);
}

.card .icons { display: flex; gap: 2px; margin-right: -6px; }
.card .ib { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--fg); padding: 0; }
.card .ib:hover { background: var(--card-hover); }
.card .ib:disabled { opacity: .3; cursor: default; background: none; }

.card .bar { margin: 10px 26px 22px; height: 14px; border-radius: 5px; }
.card .bar .k { width: 14px; height: 14px; margin-left: -7px; margin-top: -7px; border-radius: 4px; border-width: 2px; }
.swrow { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 20px 12px; }
.swi { position: relative; }
.sw { position: relative; display: block; width: 28px; height: 28px; border-radius: 5px; overflow: hidden; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: box-shadow .15s; }
.sw input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border: 0; padding: 0; opacity: 0; cursor: pointer; }
.swi.sel .sw { box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 0 0 2px var(--card), 0 0 0 3.5px var(--fg); }
.sw:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
.swi .x {
  position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; padding: 0; border-radius: 50%;
  border: 1px solid var(--card-line-strong); background: var(--card); color: var(--muted);
  font-size: 12px; line-height: 1; display: grid; place-items: center; opacity: 0; transition: opacity .15s;
}
.swi:hover .x, .swi .x:focus-visible { opacity: 1; }
.swi .x:hover { color: var(--fg); }
@media (hover: none) { .swi .x { opacity: 1; } }
.swi.add button {
  width: 28px; height: 28px; border-radius: 5px; padding: 0; display: grid; place-items: center;
  border: 1px dashed var(--card-line-strong); background: none; color: var(--muted);
}
.swi.add button:hover { color: var(--fg); border-color: var(--muted); }
.swi.add button:disabled { opacity: .35; cursor: default; }
.card .rl { font-size: 14px; }
.sw.base { width: 28px; height: 28px; border-radius: 5px; }

/* segmented type control */
.card .seg { flex: 1; background: var(--card-sel); border-radius: 10px; padding: 3px; }
.card .seg button { height: 32px; border-radius: 8px; font-size: 14px; }
.card .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }


.arow {
  display: flex; align-items: center; gap: 12px; width: 100%; height: 38px; padding: 0 20px;
  border: 0; background: none; color: var(--fg); font: 14px var(--sans); text-align: left;
}
.arow:hover:not(:disabled) { background: var(--card-hover); }
.arow:disabled { opacity: .38; cursor: default; }
.card .row.off { opacity: .38; }
.card .switch { width: 40px; height: 24px; }
.card .switch span { background: var(--card-line-strong); }
.card .switch span::after { top: 3px; left: 3px; width: 18px; height: 18px; }
.card .switch input:checked + span { background: var(--fg); }
.card .switch input:checked + span::after { transform: translateX(16px); background: var(--card); box-shadow: none; }
.card .row.off input { cursor: default; }
.arow svg { flex: none; }
.arow kbd { margin-left: auto; }

.sec { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.sec:last-child { border-bottom: 0; }
.sec > h2 { margin: 0; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.bar { position: relative; height: 30px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); cursor: copy; margin: 0 9px 18px; touch-action: none; }
.bar .k {
  position: absolute; top: 100%; width: 18px; height: 22px; margin-left: -9px; margin-top: -8px;
  border-radius: 5px; border: 2px solid var(--panel); padding: 0;
  box-shadow: 0 0 0 1px var(--line), 0 2px 4px rgba(0,0,0,.2);
  cursor: ew-resize; touch-action: none;
}
.bar .k.sel { box-shadow: 0 0 0 2px var(--fg), 0 2px 4px rgba(0,0,0,.2); }

.chips { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.chip { width: 30px; height: 30px; border-radius: 8px; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.chip.sel { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px var(--panel), 0 0 0 4px var(--fg); }
.chipw { position: relative; }
.chipw .x {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-size: 12px; line-height: 1; display: grid; place-items: center;
  opacity: 0; transition: opacity .15s;
}
.chipw:hover .x, .chipw .x:focus-visible { opacity: 1; }
.chipw .x:hover { color: var(--fg); border-color: var(--muted); }
@media (hover: none) { .chipw .x { opacity: 1; } }
.chip.add { background: var(--chip); color: var(--muted); font-size: 18px; box-shadow: none; }

.editor { display: grid; gap: 10px; background: var(--chip); border-radius: var(--r); padding: 12px; }
.color-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
input[type="color"] { width: 40px; height: 34px; border: 0; padding: 0; background: none; border-radius: 7px; cursor: pointer; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.12); border-radius: 7px; }
input[type="color"]::-moz-color-swatch { border: 1px solid rgba(0,0,0,.12); border-radius: 7px; }
.hex {
  height: 34px; min-width: 0; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); font-family: var(--mono); text-transform: lowercase;
}
.hex[aria-invalid="true"] { border-color: #d64545; }
.icon-btn { height: 34px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.icon-btn:hover { color: var(--fg); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }

.field { display: grid; grid-template-columns: 70px minmax(0, 1fr) 48px; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 13px; }
.field output { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
input[type="range"] { width: 100%; accent-color: var(--fg); }
select { height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); padding: 0 8px; width: 100%; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { justify-content: center; }
.actions .wide { grid-column: 1 / -1; }
.switch { position: relative; display: inline-block; width: 38px; height: 22px; text-transform: none; letter-spacing: 0; cursor: pointer; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + span { background: var(--fg); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.vset { display: grid; gap: 12px; }
.vrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.vrow > span { font-size: 14px; color: var(--muted); }
.opts { display: inline-flex; background: var(--opt-track, var(--chip)); border-radius: 9px; padding: 3px; gap: 2px; }
.opts button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 7px; font: 500 13px var(--sans); color: var(--muted); }
.opts button[aria-pressed="true"] { background: var(--opt-on, var(--panel)); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.opts button:not([aria-pressed="true"]):hover { color: var(--fg); }
.vprev { position: relative; height: min(42vh, 380px); border-radius: 10px; overflow: hidden; background: #0d0d0c; }
.sheet .vprev video { width: 100%; height: 100%; max-height: none; object-fit: contain; display: block; border-radius: 0; background: transparent; }
.vprev.px video { object-fit: none; }
.vprev.checker { background-color: #e9e9e7; background-image: conic-gradient(#d4d4d1 25%, transparent 0 50%, #d4d4d1 0 75%, transparent 0); background-size: 18px 18px; }
.vprev-status { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 9px; font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); font-variant-numeric: tabular-nums; }
.vzoom { position: absolute; top: 10px; right: 10px; height: 28px; font-size: 12px; }
.vzoom[aria-pressed="true"] { background: var(--fg); color: var(--on-fg); border-color: var(--fg); }
.vinfo { margin: 0; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet video { width: 100%; max-height: 52vh; border-radius: 8px; background: #000; }
.progress { display: grid; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .15s; }

/* ---------- Export overlay & toast ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(10,10,10,.6);
  display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.sheet { background: var(--panel); border-radius: 14px; padding: 18px; width: min(720px, 100%); display: grid; gap: 14px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sheet img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 8px; background: var(--chip); }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
/* ---------- Library view ---------- */
.btn .count {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--chip);
  font: 500 11px/20px var(--mono); text-align: center; color: var(--muted);
}
.libview {
  position: fixed; inset: 0; z-index: 25; overflow-y: auto;
  background: var(--bg);
  padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  animation: libin .28s cubic-bezier(.2,.7,.2,1);
}
@keyframes libin { from { opacity: 0; transform: translateY(14px); } }
.libview-head { display: flex; justify-content: flex-start; align-items: center; gap: 14px; margin: 0 auto 20px; max-width: 1480px; }
.libview-title { display: flex; align-items: baseline; gap: 12px; }
.libview-head #libClose { width: 36px; height: 36px; border-radius: 50%; }
.libview-title h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.libview-title span { font: 12px var(--mono); color: var(--muted); }
.libgrid {
  max-width: 1480px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px;
}
.sleeve {
  position: relative; aspect-ratio: 4 / 3; background: var(--panel); cursor: pointer;
  color: var(--muted); font: 500 9.5px/1.45 var(--sans); letter-spacing: .09em; text-transform: uppercase;
  outline-offset: 3px; overflow: hidden;
}
.sleeve .tl, .sleeve .tr, .sleeve .bl, .sleeve .br { position: absolute; }
.sleeve .tl { top: 18px; left: 20px; color: var(--fg); }
.sleeve .tl small { display: block; margin-top: 10px; font-size: 8px; color: var(--muted); }
.sleeve .tl .nm { font-size: 11px; letter-spacing: .1em; }
.sleeve .tl .nm[contenteditable="true"] { outline: 1px solid var(--focus); outline-offset: 3px; border-radius: 2px; cursor: text; text-transform: none; letter-spacing: .02em; }
.sleeve .tr { top: 18px; right: 20px; color: var(--fg); }
.sleeve .bl { bottom: 18px; left: 20px; font-variant-numeric: tabular-nums; }
.sleeve .br { bottom: 16px; right: 20px; font-weight: 600; letter-spacing: .22em; color: var(--fg); font-size: 9px; }
.sleeve .art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.sleeve .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sleeve .art { box-shadow: var(--art-shadow); border-radius: 2px; }
.sleeve .art canvas { border-radius: 2px; }
.sleeve:hover .art, .sleeve:focus-visible .art { transform: translate(-50%, -50%) scale(1.04); }
.sleeve .acts {
  position: absolute; left: 50%; bottom: 46px; transform: translate(-50%, 6px); display: flex; gap: 6px; white-space: nowrap; padding: 4px 0; overflow: hidden;
  opacity: 0; transition: opacity .2s, transform .2s;
}
.sleeve:hover .acts, .sleeve:focus-within .acts { opacity: 1; transform: translate(-50%, 0); }
.sleeve .acts button {
  height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg);
  font: 500 11px var(--sans); letter-spacing: 0; text-transform: none; color: var(--fg);
}
.sleeve.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { 0% { box-shadow: inset 0 0 0 2px var(--focus); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
.sleeve .acts button.danger.armed { background: #d64545; border-color: #d64545; color: #fff; }
@media (hover: none) { .sleeve .acts { opacity: 1; transform: translate(-50%, 0); } }
.sleeve.savecard { border: 0; padding: 0; text-align: left; box-shadow: inset 0 0 0 1.5px var(--card-line-strong); }
.sleeve.savecard .tr { color: var(--muted); }
.savepill {
  position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 13px; border-radius: 999px; background: var(--fg); color: var(--on-fg);
  font: 500 12px var(--sans); letter-spacing: 0; text-transform: none;
}
.sleeve.savecard:hover .savepill { transform: translateX(-50%) translateY(-1px); }
.libempty { max-width: 420px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
.libempty p:first-child { font-size: 18px; color: var(--fg); margin-bottom: 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  transform: translate(-50%, 20px); opacity: 0;
  background: var(--fg); color: var(--on-fg); padding: 9px 16px; border-radius: 999px; font-weight: 500;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Narrow screens: the dock stacks into rows ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .dock { width: 100%; }
  .dock .tiles { flex: 1 1 0; min-width: 0; }
  .dtools { display: flex; flex: none; border-left: 1px solid var(--card-line); padding-left: 6px; }
  .sidebtn { display: inline-flex; gap: 6px; padding: 0 10px; }
  /* the right column becomes a card that opens above the dock */
  .side {
    position: fixed; z-index: 15; left: 16px; right: 16px; bottom: calc(var(--dock-h, 150px) + 4px);
    width: auto; max-height: 62vh; margin: 0; display: none; animation: popin .16s ease-out;
  }
  .side.open { display: flex; }
  .dlabel { display: none; }
}
/* ---------- Touch screens: bigger targets, no keyboard hints ---------- */
button, .sw, .sleeve { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (hover: none), (pointer: coarse), (max-width: 480px) { kbd, .arow kbd { display: none; } }
@media (pointer: coarse) {
  .btn { height: 40px; }
  .btn.icon { width: 40px; }
  /* handles keep their look but get a finger-sized hit area */
  .h::before, .bar .k::before { content: ""; position: absolute; inset: -13px; border-radius: 50%; }
  .h.center::before { inset: -11px; }
  .card .row { min-height: 44px; }
  .card .ib { width: 40px; height: 40px; }
  .card .seg button { height: 38px; }
  .card input[type="range"] { height: 36px; }
  .card input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11.5px; }
  .card input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; }
  .card .switch { width: 48px; height: 28px; }
  .card .switch span::after { width: 22px; height: 22px; }
  .card .switch input:checked + span::after { transform: translateX(20px); }
  .swrow { gap: 12px; padding-top: 8px; }
  .sw, .sw.base, .swi.add button { width: 36px; height: 36px; border-radius: 7px; }
  .swi .x { width: 20px; height: 20px; top: -8px; right: -8px; font-size: 13px; }
  .swi .x::before { content: ""; position: absolute; inset: -8px; }
  .arow { height: 48px; }
  .opts button { height: 36px; padding: 0 14px; }
  .tile > button:first-child { width: 72px; height: 46px; }
  .sleeve .acts button { height: 34px; padding: 0 14px; font-size: 12px; }
  .savepill { height: 36px; padding: 0 16px; font-size: 13px; }
  /* iOS zooms into anything typed under 16px */
  .sleeve .tl .nm[contenteditable="true"] { font-size: 16px; }
  .hex { font-size: 16px; }
}

/* ---------- Small phones ---------- */
@media (max-width: 480px) {
  .top { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); gap: 8px; padding-left: 12px; padding-right: 12px; }
  .brand { display: none; }
  .top { justify-content: flex-end; }
  .top-actions { gap: 6px; flex-wrap: nowrap; }
  .top .btn { height: 38px; }
  .top .btn.icon { width: 38px; }
  .top #randomBtn { padding: 0 12px; }
  .stage { padding: 14px 16px 10px; }
  .frame, .frame canvas { border-radius: 18px; }
  .card .row { padding: 0 16px; }
  .card .row.slide { grid-template-columns: 84px minmax(0, 1fr); }
  .libview { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .libview-title h2 { font-size: 20px; }
  .overlay { padding: 12px; align-items: end; }
  .sheet { padding: 16px; border-radius: 16px; }
  .vrow { gap: 8px; }
  .vrow .opts { width: 100%; }
  .vrow .opts button { flex: 1; }
  .vprev { height: min(36vh, 300px); }
  .sheet-actions .btn { flex: 1; justify-content: center; }
  .sheet-actions { position: sticky; bottom: -16px; z-index: 2; margin: 0 -16px -16px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); }
}
@media (max-width: 400px) {
  .top-actions { gap: 4px; }
  .top .btn { height: 36px; }
  .top .btn.icon { width: 36px; }
  .top #randomBtn { padding: 0 10px; }
}
@media (max-width: 340px) { .top-actions { flex-wrap: wrap; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</head>
<body>

<header class="top">
  <div class="brand">Gradient</div>
  <div class="top-actions">
    <div class="hist" role="group" aria-label="History">
      <button class="btn icon" id="undoBtn" type="button" aria-label="Undo" title="Undo (Ctrl+Z / ⌘Z)" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M7.5 4.5L4 8l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4 8h7.5a4.5 4.5 0 0 1 0 9H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
      <button class="btn icon" id="redoBtn" type="button" aria-label="Redo" title="Redo (Shift+Ctrl+Z / ⇧⌘Z)" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5L16 8l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M16 8H8.5a4.5 4.5 0 0 0 0 9H11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
    </div>
    <button class="btn icon theme" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="sun" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 2.5v1.6M10 15.9v1.6M2.5 10h1.6M15.9 10h1.6M4.7 4.7l1.1 1.1M14.2 14.2l1.1 1.1M4.7 15.3l1.1-1.1M14.2 5.8l1.1-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><svg class="moon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16.5 12.2A6.6 6.6 0 0 1 7.8 3.5a6.6 6.6 0 1 0 8.7 8.7z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
    <button class="btn icon" id="libBtn" type="button" aria-label="Library" title="Library (L) · save with S"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="11" y="3" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="3" y="11" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="11" y="11" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
    <button class="btn primary" id="randomBtn" type="button">Randomize <kbd>R</kbd></button>
  </div>
</header>

<main class="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Gradient preview"></canvas>
      <div class="handles" id="handles"></div>
    </div>
  </div>
  <div class="meta" id="meta"></div>

  <aside class="side card" id="side" aria-label="Settings">
    <div class="side-scroll">
      <div class="row"><span class="lbl">Size</span><span class="rv" id="sizeVal"></span></div>
      <div class="sizes" id="sizes" role="radiogroup" aria-label="Size"></div>
      <div class="psep"></div>
      <div class="row">
        <div class="seg" id="modes" role="group" aria-label="Gradient type">
          <button type="button" data-mode="linear">Linear</button>
          <button type="button" data-mode="radial">Radial</button>
          <button type="button" data-mode="mesh">Mesh</button>
        </div>
      </div>
      <div class="psep"></div>
      <div class="row">
        <span class="lbl">Colors</span>
        <span class="icons"><button class="ib" id="reverseBtn" type="button" title="Reverse order" aria-label="Reverse color order"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7h11M13 4l3 3-3 3M15 13H4M7 10l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ib" id="shuffleBtn" type="button" title="New colors" aria-label="Pick new colors"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
      </div>
      <div class="swrow" id="colorList"></div>
      <div class="bar" id="bar" title="Click to add a color"></div>
      <div class="row slide" id="sizeField">
        <label for="selSize">Spread</label>
        <input type="range" id="selSize" min="15" max="120" step="1"><output id="sizeOut" hidden></output>
      </div>
      <div class="row" id="baseRow">
        <span class="rl">Background</span>
        <label class="sw base"><input type="color" id="baseColor" aria-label="Background color"></label>
      </div>
      <div class="psep"></div>
      <div class="row slide" id="angleField">
        <label for="angle">Angle</label>
        <input type="range" id="angle" min="0" max="360" step="1"><output id="angleOut" hidden></output>
      </div>
      <div class="row slide">
        <label for="blur">Blur</label>
        <input type="range" id="blur" min="0" max="200" step="1"><output id="blurOut" hidden></output>
      </div>
      <div class="psep"></div>
      <div class="row"><span class="lbl">Texture</span></div>
      <div class="row">
        <div class="seg tex" id="texKinds" role="group" aria-label="Texture">
          <button type="button" data-tex="none">None</button>
          <button type="button" data-tex="fluted">Fluted</button>
          <button type="button" data-tex="ripple">Ripple</button>
          <button type="button" data-tex="grid">Grid</button>
        </div>
      </div>
      <div class="row slide" id="texSizeField">
        <label for="texSize">Size</label>
        <input type="range" id="texSize" min="0" max="100" step="1"><output id="texSizeOut" hidden></output>
      </div>
      <div class="row slide" id="texDepthField">
        <label for="texDepth">Depth</label>
        <input type="range" id="texDepth" min="0" max="100" step="1"><output id="texDepthOut" hidden></output>
      </div>
      <div class="row slide">
        <label for="grain">Noise</label>
        <input type="range" id="grain" min="0" max="40" step="1"><output id="grainOut" hidden></output>
      </div>
      <div class="psep"></div>
      <div class="row">
        <span class="lbl">Motion</span>
        <label class="switch" title="Animate the gradient">
          <input type="checkbox" id="motionOn" aria-label="Animate the gradient"><span aria-hidden="true"></span>
        </label>
      </div>
      <div class="row slide" id="speedField">
        <label for="speed">Loop</label>
        <input type="range" id="speed" min="3" max="20" step="1"><output id="speedOut" hidden></output>
      </div>
      <div class="row slide" id="amountField">
        <label for="amount">Movement</label>
        <input type="range" id="amount" min="5" max="100" step="1"><output id="amountOut" hidden></output>
      </div>
    </div>
    <div class="side-foot" role="group" aria-label="Export">
      <button class="fbtn" id="copyBtn" type="button"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Copy CSS</span></button>
      <button class="fbtn" id="pngBtn" type="button"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3.5v9M6 9l4 4 4-4M4 16.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>PNG</span></button>
      <button class="fbtn" id="mp4Btn" type="button"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 8v4l3.5-2z" fill="currentColor"/></svg><span>Video</span></button>
    </div>
  </aside>

  <div class="dock-wrap" id="dockWrap">
    <div class="dock card" id="dock" role="toolbar" aria-label="Presets">
      <span class="dlabel" aria-hidden="true">Presets</span>
      <div class="tiles" id="presets" role="group" aria-label="Presets"></div>
      <div class="dtools">
        <button class="dbtn sidebtn" type="button" id="sideBtn" aria-expanded="false" aria-controls="side" title="Settings"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 6h7M15 6h1M4 14h1M9 14h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Settings</span></button>
      </div>
    </div>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2 id="exTitle">PNG</h2>
    <img id="exImg" alt="Exported gradient">
    <video id="exVid" loop muted playsinline controls hidden></video>
    <div class="vset" id="exSettings" hidden>
      <div class="vrow"><span>Resolution</span><div class="opts" id="optRes" role="group" aria-label="Resolution"></div></div>
      <div class="vrow"><span>Quality</span><div class="opts" id="optQ" role="group" aria-label="Quality"></div></div>
      <div class="vrow"><span>Frame rate</span><div class="opts" id="optFps" role="group" aria-label="Frame rate"></div></div>
      <div class="vrow" id="bgRow"><span>Background</span><div class="opts" id="optBg" role="group" aria-label="Background"></div></div>
      <div class="vprev" id="vprev">
        <video id="exPrev" loop muted playsinline></video>
        <div class="vprev-status" id="prevStatus"></div>
        <button class="btn vzoom" id="prevZoom" type="button" aria-pressed="false">Actual pixels</button>
      </div>
      <p class="vinfo" id="exInfo"></p>
    </div>
    <div class="progress" id="exProgress" hidden>
      <div class="pbar"><i id="pFill"></i></div>
      <span id="pText">Rendering…</span>
    </div>
    <p class="note" id="exNote"></p>
    <div class="sheet-actions">

    let x = 0, y = 0, wsum = 0, lsum = 0;
    st.stops.forEach(sp => {
      const [h, sat, l] = hexHsl(sp.c), w = sat * (1 - Math.abs(2 * l - 1)) + 0.02;
      x += Math.cos(h * Math.PI / 180) * w; y += Math.sin(h * Math.PI / 180) * w; wsum += w; lsum += l;
    });
    const avgL = lsum / st.stops.length, strength = Math.hypot(x, y) / wsum;
    if (strength < 0.25 || wsum / st.stops.length < 0.12) return avgL < 0.35 ? 'dark' : 'light';
    const h = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    return h < 15 || h >= 345 ? 'red' : h < 40 ? 'orange' : h < 65 ? 'yellow' : h < 160 ? 'green'
      : h < 195 ? 'teal' : h < 250 ? 'blue' : h < 290 ? 'purple' : 'pink';
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function funName(st, taken = []) {
    const fam = hueFamily(st);
    for (let i = 0; i < 30; i++) {
      const n = Math.random() < 0.22 ? pick(SOLO_WORDS) : `${pick(HUE_WORDS[fam])} ${pick(MOOD_WORDS)}`;
      if (!taken.includes(n)) return n;
    }
    return `${pick(HUE_WORDS[fam])} ${pick(MOOD_WORDS)} ${taken.length + 1}`;
  }

  // ---------- Saved library ----------
  // Entries: { id, savedAt, state }. Older saves were bare states; wrap them on load.
  let library = store.get('gb-saved', []).map((e, i) => e && e.state
    ? { ...e, state: migrate(e.state) }
    : { id: Date.now() - i, savedAt: Date.now(), state: migrate(e) });
  library.forEach(e => { if (!e.name) e.name = funName(e.state, library.map(x => x.name)); });
  const persistLib = () => store.set('gb-saved', library);
  const libCount = () => { $('libBtn').title = `Library · ${library.length} saved (L) · save with S`; };

  function saveToLibrary() {
    const name = funName(S, library.map(x => x.name));
    library.unshift({ id: Date.now(), savedAt: Date.now(), name, state: JSON.parse(JSON.stringify(S)) });
    persistLib(); libCount();
    toast(`Saved as “${name}”`);
    if (!$('libView').hidden) {
      renderLibView();
      const fresh = $('libGrid').children[1];
      if (fresh) fresh.classList.add('fresh');
    }
  }

  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const dateStr = t => { const d = new Date(t); return `${pad(d.getMonth() + 1)} — ${pad(d.getDate())} — ${d.getFullYear()}`; };
  const MODE_NAME = { linear: 'Linear', radial: 'Radial', mesh: 'Mesh' };
  let libAnims = [];

  function renderLibView() {
    libAnims.forEach(a => cancelAnimationFrame(a.raf)); libAnims = [];
    const grid = $('libGrid'); grid.innerHTML = '';
    $('libEmpty').hidden = true;

    // First card: save what's in the editor right now
    {
      const [W, H] = FORMATS[S.format];
      const st = S;
      const card = document.createElement('button');
      card.type = 'button'; card.className = 'sleeve savecard';
      card.setAttribute('aria-label', 'Save the current gradient to the library');
      card.innerHTML = `
        <div class="tl"><span class="nm">Save this gradient</span><br>— ${MODE_NAME[S.mode]} · ${S.stops.length} colors<small>${S.motion.on ? `${S.motion.speed}s loop` : 'Still'}${matchMedia('(hover: none), (pointer: coarse)').matches ? '' : ' · press S anytime'}</small></div>
        <div class="tr">New</div>
        <div class="bl">${dateStr(Date.now())}</div>
        <div class="br">Gradient</div>
        <div class="art"><canvas class="main"></canvas></div>
        <span class="savepill"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Save</span>`;
      grid.appendChild(card);
      const box = card.getBoundingClientRect();
      const sc = Math.min(box.width * 0.5 / W, box.height * 0.52 / H);
      const art = card.querySelector('.art'), cv2 = card.querySelector('canvas');
      const aw = Math.round(W * sc), ah = Math.round(H * sc), dpr = Math.min(2, devicePixelRatio || 1);
      art.style.width = aw + 'px'; art.style.height = ah + 'px';
      art.classList.toggle('circle', st.format === 'circle');
      cv2.width = Math.round(aw * dpr); cv2.height = Math.round(ah * dpr);
      paint(cv2.getContext('2d', { willReadFrequently: true }), cv2.width, cv2.height, { ...S, grain: S.grain * 0.45 });
      card.addEventListener('click', saveToLibrary);
    }
    $('libSub').textContent = library.length ? `${library.length} saved` : '';
    library.forEach((entry, idx) => {
      const st = entry.state, [W, H, label] = FORMATS[st.format];
      const num = library.length - idx;
      const card = document.createElement('div');
      card.className = 'sleeve'; card.tabIndex = 0; card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `Open ${entry.name}`);
      card.innerHTML = `
        <div class="tl"><span class="nm" spellcheck="false"></span><br>— ${MODE_NAME[st.mode]} · ${st.stops.length} colors<small>${st.motion.on ? `${st.motion.speed}s loop` : 'Still'}</small></div>
        <div class="tr">GRD — ${pad(num, 3)}</div>
        <div class="bl">${dateStr(entry.savedAt)}</div>
        <div class="br">Gradient</div>
        <div class="art"><canvas class="main"></canvas></div>
        <div class="acts">
          <button type="button" data-act="open">Open</button>
          <button type="button" data-act="rename">Rename</button>
          <button type="button" data-act="dup" title="Make a copy to build on">Duplicate</button>
          <button type="button" class="danger" data-act="del">Delete</button>
        </div>`;
      grid.appendChild(card);
      const nm = card.querySelector('.nm');
      nm.textContent = entry.name;

      // size the artwork to the gradient's own proportions, inside the sleeve
      const art = card.querySelector('.art');
      const box = card.getBoundingClientRect();
      const sc = Math.min(box.width * 0.5 / W, box.height * 0.52 / H);
      const aw = Math.round(W * sc), ah = Math.round(H * sc);
      art.style.width = aw + 'px'; art.style.height = ah + 'px';
      art.classList.toggle('circle', st.format === 'circle');
      const dpr = Math.min(2, devicePixelRatio || 1);
      const main = card.querySelector('.main');
      main.width = Math.round(aw * dpr); main.height = Math.round(ah * dpr);
      const mctx = main.getContext('2d', { willReadFrequently: true });
      const drawAt = t => {
        // grain is per pixel, so thin it out on these small previews to keep it looking fine
        paint(mctx, main.width, main.height, { ...animated(st, t), grain: st.grain * 0.45 });
      };
      drawAt(0);

      // saved motion plays while you hover
      const anim = { raf: 0 };
      libAnims.push(anim);
      if (st.motion.on) {
        const t0 = { v: 0 };
        const step = now => { if (!t0.v) t0.v = now; drawAt(((now - t0.v) / 1000 / st.motion.speed) % 1); anim.raf = requestAnimationFrame(step); };
        card.addEventListener('mouseenter', () => { t0.v = 0; anim.raf = requestAnimationFrame(step); });
        card.addEventListener('mouseleave', () => { cancelAnimationFrame(anim.raf); drawAt(0); });
      }

      const open = () => {
        S = migrate(JSON.parse(JSON.stringify(st)));
        sel = 0; fit(); draw(); closeLibrary();
        toast(`Opened ${entry.name}`);
      };
      const del = card.querySelector('[data-act="del"]');
      const finishRename = () => {
        if (nm.contentEditable !== 'true') return;
        nm.contentEditable = 'false';
        const v = nm.textContent.replace(/\s+/g, ' ').trim().slice(0, 40);
        if (v) { entry.name = v; persistLib(); }
        nm.textContent = entry.name;
        card.setAttribute('aria-label', `Open ${entry.name}`);
      };
      nm.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finishRename(); card.focus(); }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); nm.textContent = entry.name; finishRename(); card.focus(); }
        e.stopPropagation();
      });
      nm.addEventListener('blur', finishRename);
      card.addEventListener('click', e => {
        if (nm.contentEditable === 'true' && e.target === nm) return;
        const act = e.target.closest('[data-act]');
        if (act && act.dataset.act === 'rename') {
          nm.contentEditable = 'true'; nm.focus();
          const r = document.createRange(); r.selectNodeContents(nm);
          const sel2 = getSelection(); sel2.removeAllRanges(); sel2.addRange(r);
          return;
        }
        if (act && act.dataset.act === 'dup') {
          const names = library.map(x => x.name);
          const base = entry.name.replace(/ copy( \d+)?$/, '');
          let name = `${base} copy`, n = 2;
          while (names.includes(name)) name = `${base} copy ${n++}`;
          const copy = { id: Date.now(), savedAt: Date.now(), name, state: JSON.parse(JSON.stringify(st)) };
          library.unshift(copy);
          persistLib(); libCount(); renderLibView();
          const first = $('libGrid').firstElementChild;
          if (first) { first.classList.add('fresh'); first.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); first.focus({ preventScroll: true }); }
          toast(`Duplicated as “${name}”`);
          return;
        }
        if (act && act.dataset.act === 'del') {
          if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Delete for good?'; return; }
          library = library.filter(x => x !== entry); persistLib(); libCount(); renderLibView(); toast('Deleted');
          return;
        }
        open();
      });
      card.addEventListener('mouseleave', () => { del.classList.remove('armed'); del.textContent = 'Delete'; });
      card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); open(); } });
      card.addEventListener('mouseleave', finishRename);
    });
  }
  let libReturn = null;
  function openLibrary() {
    libReturn = document.activeElement;
    $('libView').hidden = false;
    document.body.style.overflow = 'hidden';
    renderLibView();
    $('libClose').focus();
  }
  function closeLibrary() {
    libAnims.forEach(a => cancelAnimationFrame(a.raf)); libAnims = [];
    $('libView').hidden = true;
    document.body.style.overflow = '';
    libReturn && libReturn.focus && libReturn.focus();
  }
  $('libBtn').onclick = openLibrary;
  $('libClose').onclick = closeLibrary;
  addEventListener('resize', () => { if (!$('libView').hidden) renderLibView(); });
  libCount();

  // ---------- Boot ----------
  new ResizeObserver(() => { fit(); draw(); }).observe(stage);
  renderLibrary();
  fit();
  draw();
})();
</script>
</body>
</html>
