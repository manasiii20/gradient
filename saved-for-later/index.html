<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved for Later</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Layout: one vertical 9:16 phone stage on a gridded grey board; headline centred, dock pinned to the bottom edge. Single light look, deliberately. */
:root {
  --page: #d6d6d4;
  --board: #e2e2e1;
  --grid: #c4c4c3;
  --ink: #0e0e0e;
  --muted: #5d5d5b;
  --glass: rgba(246, 246, 245, 0.58);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --display: "Instrument Serif", "Didot", "Bodoni 72", "Times New Roman", serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}

/* ---------- Stage ---------- */
.stage {
  position: relative;
  width: min(100%, calc((100dvh - 110px) * 9 / 16));
  max-width: 100%;
  aspect-ratio: 9 / 16;
  container-type: size;
  overflow: hidden;
  border-radius: 10px;
  background-color: var(--board);
  --cell: 8cqw;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  background-position: calc(50% + var(--cell) / 2) calc(50% + var(--cell) / 2);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 20px 50px -30px rgba(0,0,0,.35);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
@media (hover: hover) and (pointer: fine) {
  .stage, .stage * { cursor: none; }
}

/* ---------- Title block ---------- */
.title {
  position: absolute;
  left: 50%;
  top: 44%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.4cqw;
  pointer-events: none;
}
.pill {
  font-family: var(--sans);
  font-size: 2.55cqw;
  letter-spacing: 0.02em;
  padding: 1.15cqw 2.1cqw;
  border: 1px solid var(--ink);
  border-radius: 50%;
  line-height: 1;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 15.5cqw;
  line-height: 0.84;
  letter-spacing: -0.035em;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 .line { display: block; white-space: nowrap; }
h1 em { font-style: italic; letter-spacing: -0.03em; }

.pill, h1 .line { opacity: 0; transform: translateY(0.9cqw); filter: blur(4px); }
.stage.intro .pill,
.stage.intro h1 .line {
  animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: calc(0.2s + var(--i) * 0.13s);
}
@keyframes rise { to { opacity: 1; transform: none; filter: none; } }

/* ---------- Dock ---------- */
.dock {
  position: absolute;
  left: 50%;
  bottom: 6cqw;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 2.1cqw;
  padding: 2.1cqw 2.6cqw;
  border-radius: 3.6cqw;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  box-shadow: 0 0.6cqw 3cqw -1cqw rgba(0,0,0,.18), 0 0 0 0.5px rgba(0,0,0,.06);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  backdrop-filter: blur(22px) saturate(1.6);
  transform: translate(-50%, 170%);
  opacity: 0;
  transition: transform 0.85s cubic-bezier(.2,1.25,.35,1), opacity 0.4s ease;
}
.stage.dock-in .dock { transform: translate(-50%, 0); opacity: 1; }

.slot { position: relative; width: 11.2cqw; height: 11.2cqw; display: grid; place-items: center; }
.slot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.slot.finder { width: 10cqw; height: 10cqw; }
.slot.trash { width: 8.2cqw; height: 10cqw; }
.divider { width: 1px; align-self: stretch; margin-block: 1.4cqw; background: rgba(0,0,0,.16); }

.folder {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  width: 100%;
  height: 100%;
  border-radius: 2cqw;
  transform-origin: 50% 100%;
  transition: transform 0.45s cubic-bezier(.3,1.6,.5,1);
}
.folder:focus-visible { outline: 2px solid #1e7be0; outline-offset: 0.6cqw; }
.folder .paper, .folder .paper-back, .folder .front {
  transform-box: fill-box;
  transition: transform 0.45s cubic-bezier(.3,1.5,.5,1);
}
.folder .front { transform-origin: 50% 100%; }
.slot.hot .folder, .stage.open .folder { transform: scale(1.14) translateY(-0.7cqw); }
.slot.hot .folder .paper, .stage.open .folder .paper { transform: translateY(-8px); }
.slot.hot .folder .paper-back, .stage.open .folder .paper-back { transform: translateY(-5px) rotate(-3deg); }
.slot.hot .folder .front, .stage.open .folder .front { transform: scaleY(0.93) skewX(-2deg); }
.folder:active { transform: scale(1.06) translateY(-0.3cqw) !important; transition-duration: 0.12s; }
.dot {
  position: absolute; bottom: -1.2cqw; left: 50%;
  width: 0.7cqw; height: 0.7cqw; margin-left: -0.35cqw;
  border-radius: 50%; background: rgba(0,0,0,.55);
  opacity: 0; transition: opacity .3s;
}
.stage.open .dot { opacity: 1; }

/* ---------- Gallery cards ---------- */
.cards { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.card {
  position: absolute;
  left: 0; top: 0;
  width: 17cqw;
  height: 17cqw;
  will-change: transform, opacity;
  opacity: 0;
}
.stage.open .card { pointer-events: auto; }
.card .inner {
  width: 100%; height: 100%;
  box-sizing: border-box;
  padding: 0.95cqw;
  background: #fff;
  border-radius: 1.5cqw;
  box-shadow: 0 0.2cqw 0.4cqw rgba(0,0,0,.12), 0 1.4cqw 2.8cqw -1cqw rgba(0,0,0,.28);
  transition: transform .35s cubic-bezier(.3,1.5,.5,1), box-shadow .35s;
}
.card .inner svg { display: block; width: 100%; height: 100%; border-radius: 0.7cqw; }
.card:hover .inner { transform: scale(1.08) rotate(0.0001deg); box-shadow: 0 0.3cqw 0.5cqw rgba(0,0,0,.12), 0 2.4cqw 4cqw -1.4cqw rgba(0,0,0,.35); }

/* ---------- Cursor ---------- */
.cursor {
  position: absolute; left: 0; top: 0; z-index: 20;
  width: 2.9cqw; height: auto;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  filter: drop-shadow(0 0.2cqw 0.25cqw rgba(0,0,0,.3));
}
.cursor.on { opacity: 1; }

/* ---------- Below-stage controls ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px 18px;
  font-size: 13px; color: var(--muted);
}
.bar button {
  font: inherit; font-weight: 500; color: var(--ink);
  background: var(--board);
  border: 1px solid var(--grid);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.bar button:hover { background: #ececeb; }
.bar button:focus-visible { outline: 2px solid #1e7be0; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .stage.intro .pill, .stage.intro h1 .line { animation-duration: .01s; animation-delay: 0s; }
  .dock, .folder, .folder * { transition-duration: .01s !important; }
}
</style>
</head>
<body>

<div class="stage" id="stage" aria-label="Saved for later in September">
  <div class="title">
    <div class="pill" style="--i:0">09/26</div>
    <h1>
      <span class="line" style="--i:1">What I</span>
      <span class="line" style="--i:2"><em>saved for</em></span>
      <span class="line" style="--i:3"><em>later</em></span>
      <span class="line" style="--i:4">in September</span>
    </h1>
  </div>

  <div class="cards" id="cards"></div>

  <div class="dock" id="dock">
    <div class="slot finder" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <clipPath id="fClip"><rect width="100" height="100" rx="23"/></clipPath>
          <linearGradient id="fDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa0f7"/><stop offset="1" stop-color="#1564e0"/></linearGradient>
          <linearGradient id="fLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e6ff"/><stop offset="1" stop-color="#58c3fb"/></linearGradient>
        </defs>
        <g clip-path="url(#fClip)">
          <rect width="100" height="100" fill="url(#fDark)"/>
          <path d="M0 0 H57 C50 18 45 38 46 58 H38 C39 74 44 88 52 100 H0 Z" fill="url(#fLight)"/>
          <path d="M57 0 C50 18 45 38 46 58 H38 C39 74 44 88 52 100" fill="none" stroke="#0f2c52" stroke-width="3.4" stroke-linejoin="round"/>
          <line x1="29" y1="28" x2="29" y2="40" stroke="#0f2c52" stroke-width="5" stroke-linecap="round"/>
          <line x1="71" y1="28" x2="71" y2="40" stroke="#0f2c52" stroke-width="5" stroke-linecap="round"/>
          <path d="M20 68 Q50 86 82 66" fill="none" stroke="#0f2c52" stroke-width="3.6" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="slot" id="folderSlot">
      <button class="folder" id="folder" type="button" aria-label="Open September saves" aria-expanded="false">
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <defs>
            <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55aef0"/><stop offset="1" stop-color="#2d88da"/></linearGradient>
            <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd2ff"/><stop offset="1" stop-color="#55b1f0"/></linearGradient>
          </defs>
          <path d="M6 14 a6 6 0 0 1 6 -6 h30 a6 6 0 0 1 4.6 2.2 l4.8 5.8 h56.6 a6 6 0 0 1 6 6 v64 a6 6 0 0 1 -6 6 h-96 a6 6 0 0 1 -6 -6 z" fill="url(#gBack)"/>
          <rect class="paper-back" x="15" y="19" width="88" height="56" rx="2.5" fill="#e6ebf0"/>
          <rect class="paper" x="13" y="23" width="94" height="56" rx="2.5" fill="#ffffff"/>
          <g class="front">
            <path d="M4 33 a6 6 0 0 1 6 -6 h100 a6 6 0 0 1 6 6 v51 a8 8 0 0 1 -8 8 h-96 a8 8 0 0 1 -8 -8 z" fill="url(#gFront)"/>
            <path d="M10 27.8 h100" stroke="#d2f0ff" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
          </g>
        </svg>
      </button>
      <span class="dot" aria-hidden="true"></span>
    </div>

    <div class="slot trash" aria-hidden="true">
      <svg viewBox="0 0 82 100">
        <defs>
          <linearGradient id="tBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#cfcfcf" stop-opacity=".85"/>
            <stop offset=".45" stop-color="#f7f7f7" stop-opacity=".7"/>
            <stop offset="1" stop-color="#b9b9b9" stop-opacity=".85"/>
          </linearGradient>
        </defs>
        <path d="M10 20 h62 l-6 70 a6 6 0 0 1 -6 5.5 h-38 a6 6 0 0 1 -6 -5.5 z" fill="url(#tBody)" stroke="#a9a9a9" stroke-width="1"/>
        <g stroke="#a3a3a3" stroke-width="1" opacity=".75">
          <line x1="22" y1="28" x2="25" y2="90"/><line x1="33" y1="28" x2="34" y2="90"/>
          <line x1="41" y1="28" x2="41" y2="90"/><line x1="49" y1="28" x2="48" y2="90"/>
          <line x1="60" y1="28" x2="57" y2="90"/>
        </g>
        <ellipse cx="41" cy="20" rx="32" ry="5.5" fill="#e4e4e4" stroke="#a9a9a9" stroke-width="1"/>
        <ellipse cx="41" cy="20" rx="27" ry="3.4" fill="#b8b8b8" opacity=".6"/>
      </svg>
    </div>
  </div>

  <svg class="cursor" id="cursor" viewBox="-1 -1 15 22" aria-hidden="true">
    <path d="M0 0 L0 17 L4.2 13.2 L7 19.5 L9.8 18.3 L7.1 12.3 L12.6 12.3 Z" fill="#000" stroke="#fff" stroke-width="1.15" stroke-linejoin="round"/>
  </svg>
</div>

<div class="bar">
  <span>Hover the folder, click to open, scroll to browse.</span>
  <button type="button" id="replay">Replay</button>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const folder = document.getElementById('folder');
  const slot = document.getElementById('folderSlot');
  const layer = document.getElementById('cards');
  const cursor = document.getElementById('cursor');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Ten saved images, drawn inline.
  const ART = [
    // Red billboard in a field
    `<rect width="100" height="100" fill="#cfe1f0"/><rect y="64" width="100" height="36" fill="#7aa53f"/><rect y="74" width="100" height="26" fill="#5f8e2d"/>
     <rect x="12" y="14" width="76" height="54" rx="5" fill="#e3261c"/><rect x="18" y="66" width="64" height="5" fill="#efefe9"/><rect x="22" y="71" width="3" height="6" fill="#dcdcd4"/><rect x="75" y="71" width="3" height="6" fill="#dcdcd4"/>`,
    // Editorial layout screenshot
    `<rect width="100" height="100" fill="#f4f4f2"/><rect x="6" y="6" width="22" height="3" fill="#cfcfcd"/><rect x="70" y="6" width="24" height="3" fill="#cfcfcd"/>
     <rect x="8" y="22" width="20" height="2" fill="#bbb"/><rect x="8" y="27" width="16" height="2" fill="#ccc"/><rect x="8" y="32" width="18" height="2" fill="#ccc"/>
     <rect x="34" y="20" width="30" height="38" fill="#fff" stroke="#dcdcdc"/><text x="49" y="47" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#c2c2c2">A</text>
     <rect x="70" y="22" width="22" height="2" fill="#bbb"/><rect x="70" y="27" width="18" height="2" fill="#ccc"/><rect x="70" y="32" width="20" height="2" fill="#ccc"/><rect x="70" y="37" width="14" height="2" fill="#ccc"/>
     <rect x="30" y="72" width="34" height="12" rx="6" fill="#232323"/><rect x="36" y="77" width="16" height="2" fill="#777"/>`,
    // Dark music poster
    `<rect width="100" height="100" fill="#151515"/><rect x="30" y="8" width="40" height="42" fill="#e9d8a2"/>
     <path d="M44 46 q3 -14 8 -16 q-3 -6 2 -9 q5 2 2 9 q6 4 4 16z" fill="#1a1a1a"/><text x="50" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="7" fill="#1a1a1a">OUT NOW</text>
     <rect x="30" y="52" width="40" height="40" fill="#f1e2b4"/><path d="M40 90 l8 -22 l6 4 l10 -10 l-6 14 l4 14z" fill="#1d1d1d"/>
     <g fill="#3a3a3a"><rect x="12" y="12" width="10" height="3"/><rect x="12" y="20" width="10" height="3"/><rect x="12" y="28" width="10" height="3"/><rect x="78" y="12" width="10" height="3"/><rect x="78" y="20" width="10" height="3"/></g>`,
    // Blue storefront illustration
    `<rect width="100" height="100" fill="#cfe6f6"/><rect y="84" width="100" height="16" fill="#ead8c3"/>
     <path d="M14 30 Q50 12 86 30 V86 H14 Z" fill="#1e3fae"/><path d="M14 30 Q50 12 86 30" fill="none" stroke="#f5c6cf" stroke-width="3"/>
     <text x="50" y="24" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#fff">Café</text>
     <g fill="#f6b6c3"><path d="M22 86 V52 a8 8 0 0 1 16 0 V86z"/><path d="M42 86 V48 a8 8 0 0 1 16 0 V86z"/><path d="M62 86 V52 a8 8 0 0 1 16 0 V86z"/></g>
     <g fill="#fff" opacity=".7"><rect x="24" y="58" width="12" height="2"/><rect x="44" y="56" width="12" height="2"/><rect x="64" y="58" width="12" height="2"/></g>
     <rect x="14" y="36" width="72" height="5" fill="#2c55c9"/>`,
    // Ceramic still life
    `<rect width="100" height="100" fill="#e8ddcc"/><rect y="72" width="100" height="28" fill="#d6c6ad"/>
     <ellipse cx="54" cy="76" rx="22" ry="3" fill="#bca98b"/>
     <path d="M44 22 h14 v6 q14 10 12 28 q-2 18 -19 20 q-17 -2 -19 -20 q-2 -18 12 -28z" fill="#c4633a"/>
     <path d="M48 32 q-8 10 -6 26" stroke="#e08a5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
     <circle cx="26" cy="70" r="7" fill="#efe6d6"/>`,
    // Type specimen
    `<rect width="100" height="100" fill="#ff5b1f"/><text x="50" y="68" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="54" fill="#fff4ec">Aa</text>
     <rect x="10" y="84" width="34" height="2" fill="#fff4ec"/><rect x="10" y="10" width="14" height="2" fill="#fff4ec"/><text x="90" y="14" text-anchor="end" font-family="Arial, sans-serif" font-size="6" fill="#fff4ec">72pt</text>`,
    // Coast at dusk
    `<defs><linearGradient id="aSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7a76c"/><stop offset="1" stop-color="#f6d2c4"/></linearGradient></defs>
     <rect width="100" height="64" fill="url(#aSky)"/><circle cx="62" cy="58" r="12" fill="#ffe7b8"/><rect y="62" width="100" height="38" fill="#2f5591"/>
     <g stroke="#9db6dd" stroke-width="1.4"><line x1="48" y1="68" x2="76" y2="68"/><line x1="52" y1="74" x2="72" y2="74"/><line x1="56" y1="80" x2="68" y2="80"/></g>`,
    // Chair on yellow
    `<rect width="100" height="100" fill="#f1c84a"/><ellipse cx="50" cy="84" rx="26" ry="3.5" fill="#d6a92c"/>
     <path d="M30 26 q20 -8 40 0 l-4 30 h-32z" fill="#1d1d1d"/><path d="M28 56 h44 q2 6 -4 8 h-36 q-6 -2 -4 -8z" fill="#2b2b2b"/>
     <g stroke="#1d1d1d" stroke-width="2.4" stroke-linecap="round"><line x1="36" y1="64" x2="30" y2="84"/><line x1="64" y1="64" x2="70" y2="84"/><line x1="50" y1="64" x2="50" y2="82"/></g>`,
    // Colour swatches
    `<rect width="100" height="100" fill="#f3f1ec"/><rect x="8" y="8" width="16" height="70" fill="#21352a"/><rect x="26" y="8" width="16" height="70" fill="#6f8b5e"/>
     <rect x="44" y="8" width="16" height="70" fill="#d9c49a"/><rect x="62" y="8" width="16" height="70" fill="#c97b5a"/><rect x="80" y="8" width="12" height="70" fill="#8e2f2b"/>
     <g fill="#9a9a96"><rect x="8" y="84" width="12" height="2"/><rect x="26" y="84" width="12" height="2"/><rect x="44" y="84" width="12" height="2"/><rect x="62" y="84" width="12" height="2"/></g>`,
    // Flower bed
    `<rect width="100" height="100" fill="#2f5a3b"/>
     <g fill="#f2a3b8"><circle cx="20" cy="22" r="7"/><circle cx="64" cy="18" r="6"/><circle cx="40" cy="48" r="8"/><circle cx="80" cy="56" r="7"/><circle cx="22" cy="78" r="6"/><circle cx="62" cy="84" r="8"/></g>
     <g fill="#fff3c9"><circle cx="20" cy="22" r="2.4"/><circle cx="64" cy="18" r="2"/><circle cx="40" cy="48" r="2.6"/><circle cx="80" cy="56" r="2.4"/><circle cx="22" cy="78" r="2"/><circle cx="62" cy="84" r="2.6"/></g>
     <g fill="#f6e6a5"><circle cx="44" cy="22" r="4"/><circle cx="86" cy="30" r="4"/><circle cx="12" cy="52" r="4"/><circle cx="60" cy="62" r="4"/><circle cx="40" cy="80" r="4"/><circle cx="86" cy="86" r="4"/></g>`
  ];
  const TILT = [-8, 5, 6, -3, 7, -6, 4, -7, 6, -4];
  const N = ART.length;

  const cards = ART.map((art, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.zIndex = String(i + 1);
    el.innerHTML = `<div class="inner"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${art}</svg></div>`;
    layer.appendChild(el);
    return el;
  });

  // ----- The arc the gallery travels along -----
  let W = 0, H = 0, cardSize = 0, lut = [], pathLen = 1, gap = 1, rest = 1, maxOff = 1;
  function measure() {
    const sr = stage.getBoundingClientRect();
    const fr = slot.getBoundingClientRect();
    W = sr.width; H = sr.height;
    cardSize = cards[0].offsetWidth;
    const fx = fr.left - sr.left + fr.width / 2;
    const fy = fr.top - sr.top + fr.height * 0.42;
    const rise = fy + 0.4 * W;
    lut = []; pathLen = 0;
    let px = fx, py = fy;
    for (let k = 0; k <= 300; k++) {
      const r = rise * k / 300;
      const x = fx + 0.16 * W * (r / W) ** 1.8;
      const y = fy - r;
      if (k) pathLen += Math.hypot(x - px, y - py);
      lut.push({ s: pathLen, x, y });
      px = x; py = y;
    }
    gap = 0.23 * W;
    // rest so the lowest card sits one step above the folder, fully out
    rest = gap * Math.round((pathLen - 0.3 * W) / gap);
    maxOff = rest + (N - 7) * gap;
  }
  function at(s) {
    let lo = 0, hi = lut.length - 1;
    if (s <= 0) return { x: lut[0].x, y: lut[0].y, a: 0 };
    if (s >= lut[hi].s) return { x: lut[hi].x, y: lut[hi].y, a: 0 };
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lut[m].s < s) lo = m; else hi = m; }
    const A = lut[lo], B = lut[hi], t = (s - A.s) / (B.s - A.s || 1);
    return { x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t, a: Math.atan2(B.x - A.x, A.y - B.y) };
  }

  // ----- State -----
  let open = false, offset = -gap, target = -gap;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function render() {
    for (let i = 0; i < N; i++) {
      const el = cards[i];
      const s = offset - i * gap;
      if (s <= 0) { el.style.opacity = '0'; el.style.visibility = 'hidden'; continue; }
      const p = at(s);
      const e = clamp(s / (gap * 0.75), 0, 1);
      const ease = 1 - (1 - e) ** 3;
      const scale = 0.32 + 0.68 * ease;
      const rot = TILT[i] * ease + (p.a * 180 / Math.PI) * 0.35;
      el.style.visibility = 'visible';
      el.style.opacity = String(clamp(s / (gap * 0.22), 0, 1));
      el.style.transform = `translate(${p.x - cardSize / 2}px, ${p.y - cardSize / 2}px) rotate(${rot}deg) scale(${scale})`;
    }
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(64, now - last); last = now;
    const rate = open ? 0.06 : 0.12;
    const k = reduce ? 1 : 1 - Math.pow(1 - rate, dt / 16.7);
    if (Math.abs(target - offset) > 0.05) { offset += (target - offset) * k; render(); }
    requestAnimationFrame(tick);
  }

  function setOpen(v) {
    open = v;
    stage.classList.toggle('open', v);
    folder.setAttribute('aria-expanded', String(v));
    folder.setAttribute('aria-label', v ? 'Close September saves' : 'Open September saves');
    measure();
    target = v ? rest : -gap;
  }

  // ----- Folder hover + click -----
  slot.addEventListener('pointerenter', () => slot.classList.add('hot'));
  slot.addEventListener('pointerleave', () => slot.classList.remove('hot'));
  folder.addEventListener('click', e => { e.stopPropagation(); setOpen(!open); });

  // ----- Browse: wheel or drag along the arc -----
  stage.addEventListener('wheel', e => {
    if (!open) return;
    e.preventDefault();
    target = clamp(target + e.deltaY * 0.9, rest, maxOff);
  }, { passive: false });

  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (!open || e.target.closest('.dock')) return;
    drag = { y: e.clientY, start: target, moved: false };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = drag.y - e.clientY;
    if (Math.abs(dy) > 5) drag.moved = true;
    target = clamp(drag.start + dy * 1.3, rest, maxOff);
  });
  window.addEventListener('pointerup', e => {
    if (drag && !drag.moved && !e.target.closest('.card') && stage.contains(e.target)) setOpen(false);
    drag = null;
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && open) setOpen(false); });

  // ----- macOS-style pointer inside the stage -----
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  stage.addEventListener('pointermove', e => {
    if (!fine || e.pointerType !== 'mouse') return;
    const r = stage.getBoundingClientRect();
    cursor.style.transform = `translate(${e.clientX - r.left - 1}px, ${e.clientY - r.top - 1}px)`;
    cursor.classList.add('on');
  });
  stage.addEventListener('pointerleave', () => cursor.classList.remove('on'));

  // ----- Intro: headline, 2 s pause, then the dock -----
  let dockTimer;
  function play() {
    clearTimeout(dockTimer);
    setOpen(false); offset = target; render();
    stage.classList.remove('intro', 'dock-in');
    void stage.offsetWidth;
    stage.classList.add('intro');
    // headline finishes at ~1.4 s; hold the text alone for 2 s before the dock rises
    dockTimer = setTimeout(() => stage.classList.add('dock-in'), 1400 + 2000);
  }
  document.getElementById('replay').addEventListener('click', play);

  addEventListener('resize', () => { measure(); if (open) target = clamp(target, rest, maxOff); render(); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { measure(); render(); });
  measure();
  play();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
