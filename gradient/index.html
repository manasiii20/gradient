<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradient</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the gradient is the workspace. Large live canvas on the left, a quiet control column on the right, library strip under the canvas. */
:root {
  --bg: #efeeeb;
  --panel: #f9f9f7;
  --line: #dddcd7;
  --fg: #171716;
  --muted: #6c6b66;
  --chip: #e7e6e2;
  --focus: #2f66f5;
  --on-fg: #f9f9f7;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --panel: #191918; --line: #2c2c2a; --fg: #ecebe7; --muted: #99988f;
    --chip: #242422; --focus: #7c9fff; --on-fg: #141413; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --panel: #191918; --line: #2c2c2a; --fg: #ecebe7; --muted: #99988f;
  --chip: #242422; --focus: #7c9fff; --on-fg: #141413; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--sans);
  display: flex;
  flex-direction: column;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- Top bar ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
.brand i { width: 18px; height: 18px; border-radius: 5px; display: block; background: var(--logo, linear-gradient(135deg, #ff7a59, #ffd36e)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--on-fg); border-color: var(--fg); }
.btn.primary:hover { opacity: .88; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.icon .moon { display: none; }
.btn.icon.to-dark .moon { display: block; }
.btn.icon.to-dark .sun { display: none; }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; }

/* ---------- Main ---------- */
.app {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
}
.work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.stage {
  flex: 1; min-height: 280px;
  display: grid; place-items: center;
  padding: 24px;
  position: relative;
}
.frame {
  position: relative;
  border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 60px -28px rgba(0,0,0,.45);
  max-width: 100%;
}
.frame canvas { display: block; width: 100%; height: 100%; border-radius: 6px; }
.handles { position: absolute; inset: 0; }
.h {
  position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%; border: 2.5px solid #fff; padding: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.15);
  touch-action: none; cursor: grab;
  transition: transform .15s;
}
.h:active { cursor: grabbing; }
.h.sel { transform: scale(1.3); box-shadow: 0 1px 6px rgba(0,0,0,.4), 0 0 0 2px rgba(0,0,0,.6); }
.h.center { background: transparent; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
.h.center::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.meta {
  text-align: center; font: 12px var(--mono); color: var(--muted);
  padding: 0 16px 14px; font-variant-numeric: tabular-nums;
}

/* ---------- Library ---------- */
.library { border-top: 1px solid var(--line); padding: 12px 0 14px; display: grid; gap: 10px; }
.lib-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 8px; padding-left: 16px; }
.lib-row h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.tiles { display: flex; gap: 8px; overflow-x: auto; padding: 3px 16px 3px 3px; scrollbar-width: thin; }
.tile { position: relative; flex: none; }
.tile > button:first-child {
  width: 64px; height: 40px; border-radius: 7px; border: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
}
.tile > button:first-child:hover { transform: translateY(-1px); }
.tile .del {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel); font-size: 12px; line-height: 1; padding: 0;
  display: none; color: var(--muted);
}
.tile:hover .del, .tile .del:focus-visible { display: block; }
.empty { color: var(--muted); font-size: 12px; padding: 10px 0; }

/* ---------- Panel ---------- */
.panel {
  min-height: 0; overflow-y: auto;
  background: var(--panel);
  border-left: 1px solid var(--line);
  padding: 4px 18px 24px;
}
.sec { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.sec:last-child { border-bottom: 0; }
.sec > h2 { margin: 0; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.bar { position: relative; height: 30px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); cursor: copy; margin: 0 9px 18px; touch-action: none; }
.bar .k {
  position: absolute; top: 100%; width: 18px; height: 22px; margin-left: -9px; margin-top: -8px;
  border-radius: 5px; border: 2px solid var(--panel); padding: 0;
  box-shadow: 0 0 0 1px var(--line), 0 2px 4px rgba(0,0,0,.2);
  cursor: ew-resize; touch-action: none;
}
.bar .k.sel { box-shadow: 0 0 0 2px var(--fg), 0 2px 4px rgba(0,0,0,.2); }

.chips { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.chip { width: 30px; height: 30px; border-radius: 8px; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.chip.sel { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px var(--panel), 0 0 0 4px var(--fg); }
.chipw { position: relative; }
.chipw .x {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-size: 12px; line-height: 1; display: grid; place-items: center;
  opacity: 0; transition: opacity .15s;
}
.chipw:hover .x, .chipw .x:focus-visible { opacity: 1; }
.chipw .x:hover { color: var(--fg); border-color: var(--muted); }
@media (hover: none) { .chipw .x { opacity: 1; } }
.chip.add { background: var(--chip); color: var(--muted); font-size: 18px; box-shadow: none; }

.editor { display: grid; gap: 10px; background: var(--chip); border-radius: var(--r); padding: 12px; }
.color-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
input[type="color"] { width: 40px; height: 34px; border: 0; padding: 0; background: none; border-radius: 7px; cursor: pointer; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.12); border-radius: 7px; }
input[type="color"]::-moz-color-swatch { border: 1px solid rgba(0,0,0,.12); border-radius: 7px; }
.hex {
  height: 34px; min-width: 0; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); font-family: var(--mono); text-transform: lowercase;
}
.hex[aria-invalid="true"] { border-color: #d64545; }
.icon-btn { height: 34px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.icon-btn:hover { color: var(--fg); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }

.field { display: grid; grid-template-columns: 70px minmax(0, 1fr) 48px; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 13px; }
.field output { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
input[type="range"] { width: 100%; accent-color: var(--fg); }
select { height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); padding: 0 8px; width: 100%; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { justify-content: center; }
.actions .wide { grid-column: 1 / -1; }
.switch { position: relative; display: inline-block; width: 38px; height: 22px; text-transform: none; letter-spacing: 0; cursor: pointer; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + span { background: var(--fg); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.sheet video { width: 100%; max-height: 52vh; border-radius: 8px; background: #000; }
.progress { display: grid; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .15s; }

/* ---------- Export overlay & toast ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(10,10,10,.6);
  display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.sheet { background: var(--panel); border-radius: 14px; padding: 18px; width: min(720px, 100%); display: grid; gap: 14px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sheet img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 8px; background: var(--chip); }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  transform: translate(-50%, 20px); opacity: 0;
  background: var(--fg); color: var(--on-fg); padding: 9px 16px; border-radius: 999px; font-weight: 500;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 0; padding: 16px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i id="logo"></i>Gradient</div>
  <div class="top-actions">
    <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="saveBtn" type="button">Save<span class="label" style="margin-left:-4px">to library</span></button>
    <button class="btn primary" id="randomBtn" type="button">Randomize <kbd>R</kbd></button>
  </div>
</header>

<main class="app">
  <div class="work">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="cv" aria-label="Gradient preview"></canvas>
        <div class="handles" id="handles"></div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <section class="library" aria-label="Library">
      <div class="lib-row"><h3>Presets</h3><div class="tiles" id="presets"></div></div>
      <div class="lib-row"><h3>Saved</h3><div class="tiles" id="saved"></div></div>
    </section>
  </div>

  <aside class="panel" aria-label="Controls">
    <section class="sec">
      <h2>Type</h2>
      <div class="seg" id="modes" role="group" aria-label="Gradient type">
        <button type="button" data-mode="linear">Linear</button>
        <button type="button" data-mode="radial">Radial</button>
        <button type="button" data-mode="mesh">Mesh</button>
      </div>
    </section>

    <section class="sec">
      <h2>Colors <button class="icon-btn" id="reverseBtn" type="button" title="Reverse color order">Reverse</button></h2>
      <div class="bar" id="bar" title="Click to add a color"></div>
      <div class="chips" id="chips"></div>
      <div class="editor">
        <div class="color-row">
          <input type="color" id="selColor" aria-label="Selected color">
          <input class="hex" id="selHex" spellcheck="false" maxlength="7" aria-label="Hex value">
          <button class="icon-btn" id="removeBtn" type="button">Remove</button>
        </div>
        <div class="field" id="posField">
          <label for="selPos">Position</label><input type="range" id="selPos" min="0" max="100" step="1"><output id="posOut"></output>
        </div>
        <div class="field" id="sizeField">
          <label for="selSize">Spread</label><input type="range" id="selSize" min="15" max="120" step="1"><output id="sizeOut"></output>
        </div>
      </div>
      <div class="field" id="baseRow" style="grid-template-columns: 70px 40px minmax(0,1fr)">
        <label for="baseHex">Background</label>
        <input type="color" id="baseColor" aria-label="Background color">
        <input class="hex" id="baseHex" spellcheck="false" maxlength="7">
      </div>
      <p class="note" id="hint"></p>
    </section>

    <section class="sec">
      <h2>Shape</h2>
      <div class="field" id="angleField">
        <label for="angle">Angle</label><input type="range" id="angle" min="0" max="360" step="1"><output id="angleOut"></output>
      </div>
      <div class="field">
        <label for="blur">Blur</label><input type="range" id="blur" min="0" max="200" step="1"><output id="blurOut"></output>
      </div>
      <div class="field">
        <label for="grain">Grain</label><input type="range" id="grain" min="0" max="40" step="1"><output id="grainOut"></output>
      </div>
      <div class="field" style="grid-template-columns: 70px minmax(0,1fr)">
        <label for="format">Size</label>
        <select id="format"></select>
      </div>
    </section>

    <section class="sec">
      <h2>Motion
        <label class="switch" title="Animate the gradient">
          <input type="checkbox" id="motionOn" aria-label="Animate the gradient"><span aria-hidden="true"></span>
        </label>
      </h2>
      <div class="field" id="speedField">
        <label for="speed">Loop</label><input type="range" id="speed" min="3" max="20" step="1"><output id="speedOut"></output>
      </div>
      <div class="field" id="amountField">
        <label for="amount">Movement</label><input type="range" id="amount" min="5" max="100" step="1"><output id="amountOut"></output>
      </div>
      <p class="note" id="motionNote"></p>
    </section>

    <section class="sec">
      <h2>Export</h2>
      <div class="actions">
        <button class="btn" id="copyBtn" type="button">Copy CSS</button>
        <button class="btn primary" id="pngBtn" type="button">Export PNG</button>
        <button class="btn primary wide" id="mp4Btn" type="button" hidden>Export MP4</button>
      </div>
      <p class="note" id="cssNote" hidden></p>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2 id="exTitle">PNG</h2>
    <img id="exImg" alt="Exported gradient">
    <video id="exVid" loop muted playsinline controls hidden></video>
    <div class="progress" id="exProgress" hidden>
      <div class="pbar"><i id="pFill"></i></div>
      <span id="pText">Rendering…</span>
    </div>
    <p class="note" id="exNote"></p>
    <div class="sheet-actions">
      <button class="btn" id="closeEx" type="button">Close</button>
      <button class="btn primary" id="dlBtn" type="button">Download PNG</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const r1 = v => Math.round(v * 10) / 10;

  const FORMATS = {
    '16:9': [1920, 1080, 'Desktop 16:9'],
    '9:16': [1080, 1920, 'Phone 9:16'],
    '1:1':  [2048, 2048, 'Square 1:1'],
    '4:5':  [1080, 1350, 'Portrait 4:5'],
    '4k':   [3840, 2160, '4K 16:9'],
  };

  // ---------- Presets ----------
  // stops: [color, position %, x %, y %, spread %]
  const PRESETS = [
    { name: 'Peach dusk', mode: 'mesh', angle: 135, cx: 50, cy: 50, base: '#2a1630', grain: 10,
      stops: [['#ff7a59', 0, 16, 18, 70], ['#ffc27a', 33, 84, 14, 60], ['#c86bfa', 66, 78, 84, 70], ['#ff4f81', 100, 18, 86, 55]] },
    { name: 'Lagoon', mode: 'linear', angle: 160, cx: 50, cy: 50, base: '#0b2530', grain: 0,
      stops: [['#c9f2e6', 0, 20, 20, 60], ['#43c6ac', 45, 80, 30, 60], ['#0f4c75', 100, 50, 85, 60]] },
    { name: 'Citrus', mode: 'radial', angle: 0, cx: 30, cy: 25, base: '#ffe9a8', grain: 6,
      stops: [['#fff6c9', 0, 20, 20, 60], ['#ffd23f', 35, 70, 30, 60], ['#ff8a1f', 75, 30, 80, 60], ['#e2481b', 100, 80, 80, 60]] },
    { name: 'Fog', mode: 'mesh', angle: 0, cx: 50, cy: 50, base: '#e9e7e2', grain: 14,
      stops: [['#c7d3dd', 0, 20, 25, 70], ['#f4e3d7', 50, 80, 20, 65], ['#d9d2e6', 100, 60, 85, 75]] },
    { name: 'Aurora', mode: 'mesh', angle: 0, cx: 50, cy: 50, base: '#06131f', grain: 8,
      stops: [['#1de9b6', 0, 22, 30, 60], ['#2979ff', 33, 70, 22, 55], ['#7c4dff', 66, 82, 74, 55], ['#00bfa5', 100, 30, 88, 45]] },
    { name: 'Sorbet', mode: 'linear', angle: 120, cx: 50, cy: 55, base: '#ffffff', grain: 0,
      stops: [['#ffb3c7', 0, 20, 20, 60], ['#ffe1a8', 33, 80, 20, 60], ['#b8f0d0', 66, 80, 80, 60], ['#b7c8ff', 100, 20, 80, 60]] },
    { name: 'Ember', mode: 'linear', angle: 200, cx: 50, cy: 50, base: '#120806', grain: 18,
      stops: [['#120806', 0, 20, 20, 60], ['#5a1a0e', 40, 80, 20, 60], ['#e2531f', 78, 60, 80, 60], ['#ffc46b', 100, 30, 80, 60]] },
    { name: 'Moss', mode: 'mesh', angle: 0, cx: 50, cy: 50, base: '#1d2a1c', grain: 12,
      stops: [['#8fb36b', 0, 25, 20, 65], ['#d8d38a', 50, 85, 35, 55], ['#3f6e4a', 100, 45, 90, 70]] },
  ];
  const fromPreset = p => ({
    mode: p.mode, angle: p.angle, cx: p.cx, cy: p.cy, base: p.base, grain: p.grain,
    format: S ? S.format : '16:9', blur: 100,
    motion: S ? { ...S.motion } : { on: false, speed: 8, amount: 50 },
    stops: p.stops.map(([c, pos, x, y, s]) => ({ c, p: pos, x, y, s })),
  });

  // ---------- Canvas handles ----------

  $('motionOn').addEventListener('change', e => { S.motion.on = e.target.checked; draw(); });
  $('speed').addEventListener('input', e => { S.motion.speed = +e.target.value; draw(); });

  // ---------- Randomize ----------
  function randomize() {
    const h0 = Math.random() * 360;
    const scheme = ['analogous', 'split', 'triad', 'mono'][Math.floor(Math.random() * 4)];
    const n = 3 + Math.floor(Math.random() * 3);
    const offs = {

      triad: i => [0, 120, 240, 60, 180][i],

        c: oklch(L, 0.07 + Math.random() * 0.13, (h0 + offs(i)) % 360),
        p: r1(i / (n - 1) * 100),
        x: r1(12 + Math.random() * 76), y: r1(12 + Math.random() * 76),
        s: Math.round(45 + Math.random() * 30),
      };
    });
    const modes = ['mesh', 'mesh', 'linear', 'radial'];
    S = {
      ...S,
      mode: modes[Math.floor(Math.random() * modes.length)],
      angle: Math.round(Math.random() * 36) * 10,
      cx: r1(20 + Math.random() * 60), cy: r1(20 + Math.random() * 60),
      base: dark ? oklch(0.18 + Math.random() * 0.08, 0.03 + Math.random() * 0.04, h0) : oklch(0.94, 0.02, h0),
      stops,
    };
    sel = 0;
    draw();
  }
  $('randomBtn').onclick = randomize;
  addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); randomize(); }
    if (e.key === 'Escape' && !$('overlay').hidden) closeExport();
  });

  // ---------- Library ----------
  function tile(st, title, onLoad, onDelete) {
    const wrap = document.createElement('div'); wrap.className = 'tile';
    const b = document.createElement('button');
    b.type = 'button'; b.title = title; b.setAttribute('aria-label', `Load ${title}`);
    b.style.background = gradient(st, false);
    b.onclick = onLoad;
    wrap.appendChild(b);
    if (onDelete) {
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'del'; d.textContent = '×'; d.setAttribute('aria-label', `Delete ${title}`);
      d.onclick = onDelete;
      wrap.appendChild(d);
    }
    return wrap;
  }
  function renderLibrary() {
    const p = $('presets'); p.innerHTML = '';
    PRESETS.forEach(pr => p.appendChild(tile(fromPreset(pr), pr.name, () => { S = fromPreset(pr); sel = 0; draw(); })));
    const s = $('saved'); s.innerHTML = '';
    if (!saved.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Nothing saved yet. Press Save to library to keep the current gradient here.';
      s.appendChild(e);
    }
    saved.forEach((st, i) => s.appendChild(tile(st, `Saved ${saved.length - i}`,
      () => { S = migrate(JSON.parse(JSON.stringify(st))); sel = 0; fit(); draw(); },
      () => { saved.splice(i, 1); store.set('gb-saved', saved); renderLibrary(); toast('Deleted'); })));
  }
  $('saveBtn').onclick = () => {
    saved.unshift(JSON.parse(JSON.stringify(S)));
    saved = saved.slice(0, 30);
    store.set('gb-saved', saved);
    renderLibrary();
    toast('Saved to library');
  };

  // ---------- Copy + export ----------
  const toastEl = $('toast'); let tt;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1600); }
  $('copyBtn').onclick = () => {
    const text = cssText(S);
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch {}
      ta.remove();
      toast(ok ? 'CSS copied' : 'Copy is blocked here. Try the downloaded file.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('CSS copied'), fallback);
    else fallback();
  };

  let blobUrl = null, fileName = 'gradient.png', lastFocus = null;
  $('pngBtn').onclick = () => {
    const [W, H] = FORMATS[S.format];
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    paint(c.getContext('2d', { willReadFrequently: true }), W, H, S);
    c.toBlob(b => {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(b);
      fileName = `gradient-${S.mode}-${W}x${H}.png`;
      openSheet('image', fileName);
      $('exImg').src = blobUrl;
      $('dlBtn').hidden = false;
      $('dlBtn').focus();
    }, 'image/png');
  };
  $('dlBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = blobUrl; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
  };
  function openSheet(kind, title) {
    if ($('overlay').hidden) lastFocus = document.activeElement;
    $('exTitle').textContent = title;
    $('exImg').hidden = kind !== 'image';
    $('exVid').hidden = kind !== 'video';
    $('exProgress').hidden = kind !== 'progress';
    $('dlBtn').hidden = kind === 'progress';
    $('dlBtn').textContent = kind === 'video' ? 'Download video' : 'Download PNG';
    $('closeEx').textContent = kind === 'progress' ? 'Cancel' : 'Close';
    $('exNote').textContent = kind === 'progress' ? 'Rendering every frame at full size. Bigger sizes and grain take longer.'
      : kind === 'video' ? "If the download doesn't start, right-click the video and choose Save Video As."
      : "If the download doesn't start, right-click the image (or long-press on a phone) and choose Save Image.";
    $('overlay').hidden = false;
  }
  function progress(i, total) {
    $('pFill').style.width = (i / total * 100) + '%';
    $('pText').textContent = `Rendering frame ${i} of ${total}`;
  }
  const tick = () => new Promise(r => setTimeout(r, 0));

  let cancelEnc = false;
  $('mp4Btn').onclick = async () => {
    if (encoding) return;
    const [W, H] = FORMATS[S.format];
    const fps = 30, total = Math.round(fps * S.motion.speed);
    const snap = JSON.parse(JSON.stringify(S));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const cx = c.getContext('2d', { willReadFrequently: true });
    const drawFrame = i => paint(cx, W, H, animated(snap, i / total), i);
    const bitrate = Math.round(W * H * fps * 0.2);
    encoding = true; cancelEnc = false;
    openSheet('progress', 'Making your video'); progress(0, total);
    $('exVid').pause();
    try {
      let out = null;
      if (window.VideoEncoder && window.VideoFrame && window.Mp4Muxer) out = await encodeMp4(c, drawFrame, W, H, fps, total, bitrate);
      if (!out && !cancelEnc) out = await recordVideo(c, drawFrame, fps, total, bitrate);
      if (!out) { encoding = false; ensureLoop(); return; }
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(out.blob);
      fileName = `gradient-${snap.mode}-${W}x${H}-${snap.motion.speed}s.${out.ext}`;
      openSheet('video', fileName);
      if (out.ext !== 'mp4') $('exNote').textContent = "This browser can't make MP4 files, so this is a WebM video. Chrome, Edge and Safari can export MP4.";
      else if (out.codec && out.codec !== 'avc') $('exNote').textContent = "This browser has no H.264 encoder, so the MP4 uses VP9/AV1. Browsers play it, but some apps (like QuickTime) may not. Chrome, Edge or Safari give a standard H.264 MP4.";
      else if (out.realtime) $('exNote').textContent = "Recorded in real time, so the length can run a little long if your computer is busy.";
      $('exVid').src = blobUrl; $('exVid').play().catch(() => {});
      $('dlBtn').focus();
    } catch (err) {
      openSheet('image', 'Video export failed');
      $('exImg').hidden = true; $('dlBtn').hidden = true;
      $('exNote').textContent = `The video couldn't be made in this browser (${err && err.message ? err.message : err}). Try a smaller size, or Chrome.`;
    }
    encoding = false; ensureLoop();
  };

  // Frame-by-frame H.264 encoding: exact timing and a perfect loop, faster than real time.
  async function encodeMp4(c, drawFrame, W, H, fps, total, bitrate) {
    // H.264 first (plays everywhere); VP9 / AV1 in MP4 if the browser has no H.264 encoder.
    const CODECS = [
      ['avc1.640033', 'avc'], ['avc1.4d0033', 'avc'], ['avc1.42e033', 'avc'], ['avc1.640028', 'avc'],
      ['vp09.00.51.08', 'vp9'], ['vp09.00.41.08', 'vp9'], ['av01.0.12M.08', 'av1'], ['av01.0.08M.08', 'av1'],
    ];
    let config = null, muxCodec = null;
    for (const [codec, mc] of CODECS) {
      const cfg = { codec, width: W, height: H, bitrate, framerate: fps };
      try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) { config = cfg; muxCodec = mc; break; } } catch {}
    }
    if (!config) return null;
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: muxCodec, width: W, height: H, frameRate: fps },
      fastStart: 'in-memory',
    });
    let encErr = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; } });
    enc.configure(config);
    for (let i = 0; i < total; i++) {
      if (cancelEnc) { try { enc.close(); } catch {} return null; }
      if (encErr) throw encErr;
      drawFrame(i);
      const vf = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(vf, { keyFrame: i % (fps * 2) === 0 });
      vf.close();
      while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 4));
      progress(i + 1, total);
      await tick();
    }
    await enc.flush();
    if (encErr) throw encErr;
    muxer.finalize();
    return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4', codec: muxCodec };
  }

  // Fallback: record the canvas in real time with whatever the browser supports.
  async function recordVideo(c, drawFrame, fps, total, bitrate) {
    if (!window.MediaRecorder || !c.captureStream) throw new Error('video recording is not supported');
    const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
      .find(t => MediaRecorder.isTypeSupported(t));
    if (!type) throw new Error('no supported video format');
    const rec = new MediaRecorder(c.captureStream(fps), { mimeType: type, videoBitsPerSecond: bitrate });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => { rec.onstop = r; });
    drawFrame(0);
    rec.start();
    const start = performance.now();
    for (let i = 0; i < total; i++) {
      if (cancelEnc) { rec.stop(); await done; return null; }
      drawFrame(i);
      progress(i + 1, total);
      const wait = start + (i + 1) * 1000 / fps - performance.now();
      await new Promise(r => setTimeout(r, Math.max(0, wait)));
    }
    rec.stop(); await done;
    return { blob: new Blob(chunks, { type }), ext: type.includes('mp4') ? 'mp4' : 'webm', realtime: true };
  }

  function closeExport() {
    if (encoding) { cancelEnc = true; }
    $('exVid').pause();
    $('overlay').hidden = true; lastFocus && lastFocus.focus();
  }
  $('closeEx').onclick = closeExport;
  $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay' && !encoding) closeExport(); });

  // ---------- Light / dark ----------
  const themeBtn = $('themeBtn');
  const isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  };
  function syncTheme() {
    const dark = isDark();
    themeBtn.classList.toggle('to-dark', !dark);
    const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
    themeBtn.setAttribute('aria-label', label); themeBtn.title = label;
  }
  const savedTheme = store.get('mix-theme', null);
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  themeBtn.onclick = () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('mix-theme', next);
    syncTheme();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  syncTheme();

  // ---------- Boot ----------
  new ResizeObserver(() => { fit(); draw(); }).observe(stage);
  renderLibrary();
  fit();
  draw();
})();
</script>
</body>
</html>
